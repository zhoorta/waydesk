# waydesk (Fedora): the sway config of RDP sessions. A copy in ~/.config/waydesk/config replaces it for one account (docs/BRING-YOUR-OWN-CONFIG.md).
# Fedora's own /etc/sway/config would start a status bar with a shell loop in every account's session and tile the windows; a remote session is
# lighter and more familiar without them: windows float with title bars, Alt+Tab switches, Alt+F4 closes, and there is no bar. The Debian desktop
# package has the full shell (bar, launcher, title-bar buttons); this is the same keyboard on a plain sway.
set $mod Mod4
set $term foot
set $menu wmenu-run

output * bg #1e1e1e solid_color

# Borders are the grip for resizing a window with the mouse: 3 px is thin to look at and still possible to hit over a remote connection.
default_border normal 3
default_floating_border normal 3
titlebar_padding 8 7
floating_modifier $mod normal
# A window gets the focus when it is clicked, not when the pointer passes over it.
focus_follows_mouse no

# Windows float (app_id is the Wayland name, shell xwayland the applications that only speak X11).
for_window [app_id=".*"] floating enable
for_window [shell="xwayland"] floating enable
# LibreOffice asks for the whole screen; as a floating window its title bar would land above the top edge, out of reach.
for_window [app_id="libreoffice.*"] resize set 1300 800, move position center

# Keys
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+q kill
bindsym Mod1+F4 kill
bindsym Mod1+Tab focus next
bindsym Mod1+Shift+Tab focus prev
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
# Emulators, games and VM consoles can grab the keyboard (sway then hands them every key); these two keys still reach sway and give the keys back.
bindsym --inhibited $mod+Escape shortcuts_inhibitor disable
bindsym --inhibited Ctrl+Alt+Escape shortcuts_inhibitor disable

# Workspaces (virtual desktops): the first is called Remote, the others are 2, 3, 4.
bindsym $mod+1 workspace Remote
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+Shift+1 move container to workspace Remote
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Ctrl+Right workspace next_on_output
bindsym $mod+Ctrl+Left workspace prev_on_output

bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'End this session? All your windows will close.' -B 'End session' 'swaymsg exit'
bindsym Print exec sh -c 'mkdir -p ~/Pictures && grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png'
bindsym $mod+Shift+s exec sh -c 'grim -g "$(slurp)" - | wl-copy'

# No bar: sway starts none without a bar block.

# The systemd integration of Fedora's sway package (the session environment for user services and portals).
include /etc/sway/config.d/*
